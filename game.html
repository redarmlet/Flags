<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAGS - Game</title>
    <link rel="stylesheet" href="style-1.css">
</head>
<body>
    <audio src="music/music.ogg" class="audio" id="audio" loop controls></audio>
    <audio src="music/correct.mp3" class="correct" id="correct"></audio>
    <audio src="music/incorrect.mp3" class="incorrect" id="incorrect"></audio>
    <audio src="music/book.mp3" id="a-book" class="a-book"></audio>
    <audio src="music/start.mp3" id="a-start" class="a-start"></audio>
    <audio src="music/info.mp3" id="a-info" class="a-info"></audio>
    <audio src="music/master.mp3" class="a-master" id="a-master"></audio>
    <audio src="music/gameover.mp3" class="a-gameover" id="a-gameover"></audio>
    <audio src="music/highscore.mp3" class="a-highscore" id="a-highscore"></audio>

    <div class="menu" id="menu">
        
        <span class="menu-title" id="m-title">GAME OVER</span>

        <div class="just">
            

            <div class="resume">
                <span class="menu-content">SCORE<span id="m-score">.................</span> </span>
                <span class="menu-content">TIME<span id="m-time">..................</span></span>
                <span class="menu-content">BONUS<span id="m-bonus">.................</span></span>
                <span class="menu-content">FINAL SCORE<span id="m-final">...........</span></span>
            </div>
            
        </div>
        

        <button class="btn-skip" id="btn-skip">>></button>
        <div class="overlay"></div>
    </div>
    <div class="content-1">
        <header>
            <button class="help" id="help"><img src="images/help.webp"></button>
            
            <img src="images/info.png" class="info" id="info">

            <div class="scoreboard">
                <span>LIVES: <span id="lives">3</span></span>
                <span>SCORE: <span id="score">0</span></span>
                <span>HIGH SCORE: <span id="high-score">000000</span></span>
                <span>TIME: <span id="time">0</span></span>
            </div>
            
        </header>

        <main>
            
            <span id="remain"> REMAINING: <span id="remaining">00</span></span>
            
            <img src="images/border.webp" class="border" id="border">

            <img id="flag-display" class="flag-display" src="images/flags/xx.webp" alt="Country flag">

            <img id="ornament" src="images/ornament.webp" class="ornament">
            <img id="ornament2" src="images/ornament.webp" class="ornament2">

        </main>

        <footer>
            <img src="images/UI-00.webp" alt="UI-DOWN" class="ui-d">
            
            <input type="text" id="country-input" placeholder="" autocomplete="off" disabled>

            <button id="btn-play" class="boton-gem">
                <img src="images/gem.webp" alt="PLAY">
            </button>

            <button id="btn-book" class="boton-book">
                <img src="images/book-off.webp" alt="BOOK">
            </button>

            <img src="images/book.png" id="book" class="book">

        </footer>
    </div>
    <div class="efecto-crt"></div>
    
    <script src="script.js"></script>
</body>
</html>
