<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLAGS - Game</title>
    <link rel="stylesheet" href="style-1.css">
</head>
<body>

    <div id="menu">
        
        <div class="overlay"></div>
        <span id="m-title">GAME OVER</span>
        <div class="go-resume">
            <span class="m-content" >SCORE<span          id="m-score">.................</span> </span>
            <span class="m-content" >TIME<span           id="m-time">..................</span></span>
            <span class="m-content" >BONUS<span          id="m-bonus">.................</span></span>
            <span class="m-content" >FINAL SCORE<span    id="m-final">...........</span></span>
        </div>
        <button id="btn-skip">>></button>
        
    </div>
    <div class="content">
        <header>

            <button id="btn-info"><img src="images/help.webp" alt="?"></button>
            <img src="images/info.png" id="info" alt="info">

            <div class="scoreboard">
                <span>LIVES: <span          id="lives">3</span></span>
                <span>SCORE: <span          id="score">0</span></span>
                <span>HIGH SCORE: <span     id="high-score">000000</span></span>
                <span>TIME: <span           id="time">0</span></span>
            </div>
            
        </header>

        <main>
            
            <span   id="remain"> REMAINING: <span id="remaining">00</span></span>
            <div class="flag-container">
                <img    id="border"         src="images/border.webp"        alt="border">
                <img    id="flag-display"   src="images/flags/xx.webp"      alt="flag-display">
                <img    id="ornament"       src="images/ornament.webp"      alt="ornament">
                <img    id="ornament2"      src="images/ornament.webp"      alt="ornament">
            </div>
            

        </main>

        <footer>

            <input type="text" id="country-input" placeholder="" autocomplete="off" disabled>
            <img        src="images/UI-00.webp"     class="ui-inputBar"     alt="UI" >
            <img        src="images/book.png"       id="book"               alt="book">

            <button     id="btn-play"               class="btn-play">
                <img    src="images/gem.webp"                               alt="btn-play">
            </button>
            <button     id="btn-book"               class="btn-book">
                <img    src="images/book-off.webp"                          alt="btn-play">
            </button>

        </footer>

    </div>

    <div class="a-folder">
        <audio      src="music/music.ogg"           id="audio" loop     ></audio>
        <audio      src="music/correct.mp3"         id="correct"        ></audio>
        <audio      src="music/incorrect.mp3"       id="incorrect"      ></audio>
        <audio      src="music/book.mp3"            id="a-book"         ></audio>
        <audio      src="music/start.mp3"           id="a-start"        ></audio>
        <audio      src="music/info.mp3"            id="a-info"         ></audio>
        <audio      src="music/master.mp3"          id="a-master"       ></audio>
        <audio      src="music/gameover.mp3"        id="a-gameover"     ></audio>
        <audio      src="music/highscore.mp3"       id="a-highscore"    ></audio>
    </div>

    <script src="script.js"></script>

</body>
</html>
